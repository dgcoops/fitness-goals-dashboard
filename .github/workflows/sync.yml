name: Sync training data

on:
  schedule:
    - cron: "17 4 * * *"   # daily, about 04:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Hevy workouts
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python scripts/hevy_sync.py
      - name: Pull Garmin activities
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: python scripts/garmin_sync.py
      - name: Pull Withings weigh-ins
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_REFRESH_TOKEN: ${{ secrets.WITHINGS_REFRESH_TOKEN }}
          WITHINGS_TOKEN_KEY: ${{ secrets.WITHINGS_TOKEN_KEY }}
        run: python scripts/withings_sync.py
      - name: Build dashboard data
        run: python scripts/build.py
      - name: Commit new data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "training-sync"
          git config user.email "training-sync@users.noreply.github.com"
          git add data site/data.json
          git diff --cached --quiet || git commit -m "Sync training data"
          git push
